[build-system]
requires = ["setuptools==68.1.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offmenu"
version = "0.1.0"
description = "Offline barcode inventory, recipe matching and retailer observations"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.10.3,<5"]

[project.optional-dependencies]
test = ["setuptools>=61", "wheel", "packaging>=24", "Pillow>=10", "openpyxl==3.1.5", "mwparserfromhell==0.7.2", "jsonschema==4.26.0", "jsonschema-rs==0.58.6", "beautifulsoup4==4.15.0"]
collection = ["duckdb==1.5.6", "pyarrow==26.0.0", "requests==2.34.2", "beautifulsoup4==4.15.0", "mwparserfromhell==0.7.2", "jsonschema==4.26.0"]

[project.scripts]
offmenu = "offmenu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["offmenu*"]

[tool.setuptools.package-data]
offmenu = ["web.html"]

"offmenu.refresh" = ["portfolio37_bindings.json", "source_recipe_template.schema.json", "english_extension.schema.json", "owner19_bindings.json", "owner20_bindings.json", "portfolio_w35.json", "portfolio47_sources.json", "portfolio_owner51.json", "portfolio55.json"]
"offmenu.refresh.portfolios" = ["worker23.json"]
"offmenu.portfolio32" = ["catalog.json"]

"offmenu_ciqual" = ["contract.json", "native-contract-v1.json"]
"offmenu_norway" = ["contract.json"]
