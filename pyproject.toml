[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offmenu"
version = "0.1.0"
description = "Offline barcode inventory, recipe matching and retailer observations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["openpyxl==3.1.5"]
collection = ["duckdb==1.5.6", "pyarrow==26.0.0"]

[project.scripts]
offmenu = "offmenu.cli:main"

[tool.setuptools.packages.find]
include = ["offmenu*"]

[tool.setuptools.package-data]
offmenu = ["web.html"]
