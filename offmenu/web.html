<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d34"><title>offmenu · Pantry to plate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2e9;color:#183d34;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px 18px 70px}h1{font-size:38px;margin:0}h2{font-size:24px}p{line-height:1.5}section{background:#fff;border:1px solid #dcded2;border-radius:18px;padding:20px;margin-top:22px}label{display:block;margin:14px 0 6px;font-weight:600}input,select,button{font:inherit;min-height:48px;border-radius:10px;padding:12px;width:100%}input,select{border:1px solid #b9c5bf;background:#fff}button{border:0;background:#183d34;color:white;font-weight:600;margin-top:10px;cursor:pointer}button.secondary{background:#e9eee9;color:#183d34}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;max-height:300px;border-radius:12px;background:#152a23;margin-top:12px}#message{white-space:pre-line;min-height:24px}article{padding:14px 0;border-bottom:1px solid #e4e7df}small{color:#56695f}.pill{font-size:13px;display:inline-block;border-radius:20px;background:#e8efe5;padding:5px 10px;margin:6px 0}button:disabled{opacity:.5} [hidden]{display:none!important}
</style></head><body><main><small>YOUR PANTRY, CONNECTED</small><h1>offmenu</h1><p>Scan what you have. Find what you can cook.</p>
<section><h2>Add to your pantry</h2><button id="scan">Scan a barcode</button><button id="stop" class="secondary" hidden>Stop camera</button><video id="video" playsinline muted hidden></video><p id="message" role="status" aria-live="polite"></p>
<form id="add"><label for="barcode">Barcode</label><input id="barcode" inputmode="numeric" pattern="[0-9]+" required><button type="button" id="lookup" class="secondary">Find product</button><label for="name">Product name</label><input id="name" required><label for="ingredient">Use as ingredient</label><input id="ingredient" placeholder="e.g. coconut milk" required><small>Choose what the product is, rather than what it contains.</small><div class="row"><div><label for="quantity">Amount remaining</label><input id="quantity" type="number" min="0" step="any" required></div><div><label for="unit">Unit</label><select id="unit"><option value="g">grams</option><option value="ml">millilitres</option><option value="count">items</option></select></div></div><label for="expires">Expiry (optional)</label><input id="expires" type="date"><button>Save item</button></form></section>
<section><h2>Your pantry</h2><div id="inventory"></div></section><section><h2>Meal options</h2><label for="servings">Servings</label><input id="servings" type="number" min="1" value="2"><button id="refresh">Find meals</button><div id="meals"></div></section>
<section><h2>Where it was sold</h2><p>Look up dated shop-price observations for the barcode above.</p><button id="shops" class="secondary">Check observations</button><div id="prices"></div></section>
</main><script>
const $=id=>document.getElementById(id);let stream,scanning=false,generation=0;
function message(text){$('message').textContent=text}
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Offmenu':'1'},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error||'Request failed');return value}
function article(parent,title,details){const a=document.createElement('article'),b=document.createElement('strong'),p=document.createElement('p');b.textContent=title;p.textContent=details;a.append(b,p);parent.append(a);return a}
async function lookup(){ $('name').value='';$('ingredient').value='';try{const p=await api('/api/product?barcode='+encodeURIComponent($('barcode').value));$('name').value=p.name;$('ingredient').value=p.ingredient||'';message('Product found. Confirm the ingredient and amount.')}catch(e){message(e.message)}}
function stop(){generation++;scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').hidden=true;$('stop').hidden=true;$('scan').disabled=false}
$('scan').onclick=async()=>{const token=++generation;$('scan').disabled=true;try{if(!window.isSecureContext)throw Error('Camera access requires HTTPS. See the phone setup instructions.');if(!('BarcodeDetector'in window))throw Error('This browser does not support barcode scanning yet. Enter the barcode manually.');const supported=await BarcodeDetector.getSupportedFormats(),formats=['ean_13','ean_8','upc_a','upc_e'].filter(x=>supported.includes(x));if(!formats.length)throw Error('Grocery barcode formats are unavailable in this browser.');const detector=new BarcodeDetector({formats});const camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==generation){camera.getTracks().forEach(t=>t.stop());return}stream=camera;$('video').srcObject=stream;$('video').hidden=false;$('stop').hidden=false;await $('video').play();scanning=true;message('Hold the barcode steady in good light.');const tick=async()=>{if(!scanning||token!==generation)return;try{const codes=await detector.detect($('video'));if(!scanning||token!==generation)return;if(codes.length){$('barcode').value=codes[0].rawValue;stop();await lookup();return}}catch(e){stop();message('Scan failed: '+e.message);return}setTimeout(tick,180)};tick()}catch(e){if(token===generation){stop();message(e.message)}}};
$('stop').onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);$('lookup').onclick=lookup;
async function pantry(){const target=$('inventory');target.replaceChildren();const rows=await api('/api/inventory');if(!rows.length)target.textContent='Your pantry is empty. Scan or enter an item to start.';for(const r of rows){const a=article(target,r.name,`${r.quantity} ${r.unit} · ${r.ingredient||'Unmapped'}${r.expires?' · expires '+r.expires:''}`),button=document.createElement('button');button.className='secondary';button.textContent='Remove lot';button.onclick=async()=>{try{await api('/api/remove',{id:r.id});await pantry();await findMeals()}catch(e){message(e.message)}};a.append(button)}}
async function findMeals(){const target=$('meals');target.replaceChildren();const rows=await api('/api/meals?servings='+encodeURIComponent($('servings').value));if(!rows.length)target.textContent='Import recipes to see meal options.';for(const r of rows){const details=r.missing.map(x=>`${x.quantity} ${x.unit} ${x.ingredient}`).join(', '),unknown=r.unknown_quantities.join(', ');article(target,r.title,`${r.status==='ready'?'Ready to cook':r.status==='missing'?'Missing: '+details:'Needs quantity review'}${unknown?' · Review: '+unknown:''}`)}}
$('add').onsubmit=async event=>{event.preventDefault();try{const data={};for(const key of ['barcode','name','ingredient','quantity','unit','expires'])data[key]=$(key).value;await api('/api/inventory',data);message('Saved to your pantry.');$('add').reset();await pantry();await findMeals()}catch(e){message(e.message)}};
$('refresh').onclick=()=>findMeals().catch(e=>message(e.message));$('shops').onclick=async()=>{try{const result=await api('/api/shops?barcode='+encodeURIComponent($('barcode').value)),target=$('prices');target.replaceChildren();if(!result.observations.length)target.textContent='No imported observations for this barcode.';for(const r of result.observations)article(target,r.retailer,`${r.currency} ${r.price} · ${r.observed_at} · historical observation`)}catch(e){message(e.message)}};
Promise.all([pantry(),findMeals()]).catch(e=>message(e.message));
</script></body></html>
