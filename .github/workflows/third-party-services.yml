name: Third-party services

on:
  workflow_dispatch:
    inputs:
      run_external_scans:
        description: Run credential-qualified Snyk and Sonar scans
        required: true
        default: false
        type: boolean
  push:
    branches: [develop, main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: third-party-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Configuration and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: npm ci
      - run: node scripts/verify-third-party-config.mjs
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - run: npm run test:locale-edge
      - run: python3 -m unittest discover -s tests -v
      - name: Portable receipt OCR admission checks
        run: >-
          python3 -B tests/global-data-validation/test_receipt_image_ocr_owner18.py -v
          ReceiptImage.test_bounds_scope_and_explicit_review
          ReceiptImage.test_capture_and_current_recheck
          ReceiptImage.test_duplicate_image_receipt_and_account_scope
          ReceiptImage.test_permissions_precede_extraction
          ReceiptImage.test_retention
          ReceiptImage.test_unknown_source_and_user_corrections

  snyk:
    name: Optional Snyk scan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_scans }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify requested Snyk configuration
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required when run_external_scans is selected."
            exit 1
          fi
      - run: npm ci
      - run: npx --yes snyk@1.1296.3 test --severity-threshold=high

  sonar:
    name: Optional Sonar scan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_external_scans }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify requested Sonar configuration
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing SONAR_TOKEN"
          [ -n "$SONAR_HOST_URL" ] || missing="$missing SONAR_HOST_URL"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing SONAR_PROJECT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required Sonar configuration:$missing"
            exit 1
          fi
      - run: npm ci
      - run: npx --yes sonar-scanner@3.1.0 -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.projectKey="$SONAR_PROJECT_KEY"
