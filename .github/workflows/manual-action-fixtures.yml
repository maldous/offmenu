name: Manual action generated fixtures
on:
  push:
    branches: [integration/manual-actions-20261022]
    paths:
      - manual-action/foo_manual.py
      - manual-action/tests/**
      - manual-action/run.sh
      - .github/workflows/manual-action-fixtures.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-fixtures:
    if: github.ref == 'refs/heads/integration/manual-actions-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Standard-library generated fixtures only
        run: python3 -B -m unittest discover -s manual-action/tests -v
