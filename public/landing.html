<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#10243a" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)"><title>OffMenu · From product to pantry to plate</title><link rel="stylesheet" href="/landing.css"><script type="module" src="/landing.js"></script></head>
<body>
<section class="intro snap-section" id="intro" aria-label="OffMenu introduction"><div id="neon-host" class="neon-host" aria-label="OffMenu neon sign"></div><p class="neon-fallback" id="neon-fallback" hidden>OffMenu</p></section>
<div class="landing" id="landing">
<header class="site-head"><a class="brand" href="/landing.html" aria-label="OffMenu home"><img src="/scanner-balanced-final.svg" alt="" width="38" height="38"><span>OffMenu</span></a><nav aria-label="Main"><a class="primary" href="/auth.html">Sign in or create account</a></nav></header>
<main class="story" aria-label="From product to pantry to plate"><div class="story-copy" id="chapter-sections"></div>

            <div class="fridge"><span class="fridge-handle"></span></div>
            <div class="freezer"></div>
            <div class="pantry"><span class="pantry-line"></span><span class="pantry-line"></span></div>
            <div class="oven"><span class="oven-window"></span></div>
            <div class="island"><div class="board"></div><div class="bowl"></div><div class="bag"></div><div class="scanner-prop"></div><div class="plate"></div></div>

                <path class="arm-right" d="M88 90 Q117 107 108 140" fill="none" stroke="var(--actor-line)" stroke-width="13" stroke-linecap="round"/>
                <path d="M46 159 L43 215 M82 159 L88 215" fill="none" stroke="var(--actor-line)" stroke-width="15" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <p class="scene-caption" id="scene-caption">One kitchen, one connected journey.</p>
        </div>
      </section></main>
</div><script type="module" src="/auth-return-bridge.js"></script></body></html>
